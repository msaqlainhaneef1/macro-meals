<style media="print">

    .announcement-bar, .scroll-progress, #back-to-top,
    .breadcrumbs, .hero-search, #search-results {
      display: none !important;
    }
    body {
      font-size: 12pt;
      line-height: 1.6;
      color: #000;
      background: #fff;
      margin: 0;
      padding: 1cm;
    }
    .container, .hero, .hero-home, section {
      max-width: 100% !important;
      padding: 0 !important;
      margin: 0 !important;
    }
    a { color: #000; text-decoration: underline; }
    a[href^="http"]::after { content: " (" attr(href) ")"; font-size: 0.8em; color: #666; }
    a[href^="/"]::after { content: " (macroandmeals.com" attr(href) ")"; font-size: 0.8em; color: #666; }
    h1, h2, h3 { page-break-after: avoid; color: #000; }
    img { max-width: 100%; }
    table { border-collapse: collapse; width: 100%; }
