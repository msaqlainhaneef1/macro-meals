<!-- Macro & Meals — Cookie Consent Banner -->
<!-- GDPR/CCPA compliant cookie notice -->
<!-- Edit this file and run build.py to update all pages -->
<!-- ============================== -->
<div id="cookie-banner" class="cookie-banner" style="display:none;">
  <div class="cookie-banner-inner">
    <p>We use cookies to improve your experience and for analytics. By continuing to use this site, you agree to our <a href="/cookie-policy/">Cookie Policy</a>.</p>
    <div class="cookie-banner-actions">
      <button id="cookie-accept" class="cookie-btn cookie-btn-accept">Accept</button>
      <button id="cookie-decline" class="cookie-btn cookie-btn-decline">Decline</button>
    </div>
  </div>
</div>
<script>
(function(){
  if (localStorage.getItem('cookie-consent')) return;
  var banner = document.getElementById('cookie-banner');
  if (!banner) return;
  banner.style.display = 'block';
  document.getElementById('cookie-accept').addEventListener('click', function(){
    localStorage.setItem('cookie-consent', 'accepted');
    banner.style.display = 'none';
  });
  document.getElementById('cookie-decline').addEventListener('click', function(){
    localStorage.setItem('cookie-consent', 'declined');
    banner.style.display = 'none';
  });
})();
</script>
