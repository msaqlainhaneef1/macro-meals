<!-- Macro & Meals — Common Head Tags -->
<!-- Analytics, favicon, manifest, theme color, stylesheet, preconnect -->
<!-- Edit this file and run build.py to update all pages -->
<!-- ============================== -->
<!-- DNS Prefetch & Preconnect for performance -->
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="https://www.googletagmanager.com">
<link rel="dns-prefetch" href="https://www.google-analytics.com">
<!-- Google Fonts — non-render-blocking with preload + swap -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap"></noscript>
<!-- Preload critical resources -->
<link rel="preload" as="image" href="/img/logo.svg" type="image/svg+xml">
<!-- Stylesheet — async loading with critical CSS inlined -->
<link rel="preload" as="style" href="/css/style.css" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="/css/style.css"></noscript>
<!-- Deferred Analytics — loaded after page interactive -->
<script>
window.addEventListener('load',function(){setTimeout(function(){
  var s=document.createElement('script');s.async=true;
  s.src='https://www.googletagmanager.com/gtag/js?id=G-7Q3DMT4258';
  document.head.appendChild(s);
  s.onload=function(){
    window.dataLayer=window.dataLayer||[];
    function gtag(){dataLayer.push(arguments);}
    window.gtag=gtag;gtag('js',new Date());gtag('config','G-7Q3DMT4258');
  };
  var g=document.createElement('script');g.async=true;
  g.src='https://www.googletagmanager.com/gtm.js?id=GTM-5FNQMD49';
  document.head.appendChild(g);
},2000)});
</script>
