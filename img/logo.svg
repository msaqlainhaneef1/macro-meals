<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 52" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#15803d" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Circle background with shadow -->
  <circle cx="24" cy="26" r="23" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- Fork: two prongs + handle -->
  <line x1="17" y1="12" x2="17" y2="24" stroke="white" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="23" y1="12" x2="23" y2="24" stroke="white" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M17 24c0 2 1.2 3.5 3 3.5s3-1.5 3-3.5" stroke="white" stroke-width="2.8" stroke-linecap="round" fill="none"/>
  <line x1="20" y1="27.5" x2="20" y2="42" stroke="white" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Leaf -->
  <path d="M30 12c-4 2-6 7-5 12 1-5 5-8 9-9-2 4-2 8-1 11 2-5 5-10 5-14-2-1-5-1-8 0z" fill="white" opacity="0.95"/>
  <path d="M31 15c-1 3-1 7 0 10" stroke="url(#bg)" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <!-- Brand text -->
  <text x="58" y="24" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="22" font-weight="800" fill="#1e293b" letter-spacing="-0.5">Macro</text>
  <text x="132" y="24" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="22" font-weight="800" fill="#22c55e" letter-spacing="-0.5">&amp;</text>
  <text x="152" y="24" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="22" font-weight="800" fill="#1e293b" letter-spacing="-0.5">Meals</text>
  <!-- Tagline -->
  <text x="58" y="42" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="10" font-weight="500" fill="#64748b" letter-spacing="1.5">NUTRITION TOOLS</text>
</svg>
