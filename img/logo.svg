<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <!-- Circle background -->
  <circle cx="24" cy="24" r="23" fill="url(#bg)"/>
  <!-- Fork: two prongs + handle -->
  <line x1="17" y1="10" x2="17" y2="22" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="23" y1="10" x2="23" y2="22" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M17 22c0 2 1.2 3.5 3 3.5s3-1.5 3-3.5" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <line x1="20" y1="25.5" x2="20" y2="40" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Leaf (right side, representing health/nutrition) -->
  <path d="M30 10c-4 2-6 7-5 12 1-5 5-8 9-9-2 4-2 8-1 11 2-5 5-10 5-14-2-1-5-1-8 0z" fill="white" opacity="0.95"/>
  <!-- Leaf vein -->
  <path d="M31 13c-1 3-1 7 0 10" stroke="url(#bg)" stroke-width="1" stroke-linecap="round" fill="none"/>
  <!-- Brand text: single line -->
  <text x="56" y="30" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="19" font-weight="800" fill="#1e293b" letter-spacing="-0.5">Macro <tspan fill="#22c55e">&amp;</tspan> Meals</text>
</svg>
